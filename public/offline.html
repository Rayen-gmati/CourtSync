<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CourtSync — hors ligne</title>
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f4f1ea;
      color: #1e4d2b;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      text-align: center;
      padding: 24px;
    }
    .card {
      max-width: 360px;
    }
    .ball {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: #c9d642;
      margin: 0 auto 24px;
      position: relative;
      overflow: hidden;
    }
    .ball::after {
      content: '';
      position: absolute;
      inset: -40%;
      border-radius: 50%;
      border: 3px solid rgba(244, 241, 234, 0.9);
      transform: translateX(30%);
    }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { font-size: 16px; line-height: 1.5; color: #4a5a4f; margin: 0 0 24px; }
    button {
      font-size: 16px;
      font-weight: 600;
      padding: 12px 28px;
      min-height: 44px;
      border: none;
      border-radius: 12px;
      background: #1e4d2b;
      color: #f4f1ea;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="ball"></div>
    <h1>Pas de connexion internet</h1>
    <p>Vérifiez votre réseau puis réessayez. Vos données restent synchronisées dès que la connexion revient.</p>
    <button onclick="window.location.reload()">Réessayer</button>
  </div>
</body>
</html>
